<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026.11.22</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Shippori Mincho', serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
  }

  .container {
    max-width: 500px;
    width: 100%;
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 45px 25px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 2;
  }

  .step {
    display: none;
    animation: fadeIn 1.4s ease forwards;
  }

  .step.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  p {
    font-size: 1.05rem;
    line-height: 2.1;
    margin-bottom: 28px;
    letter-spacing: 0.08em;
  }

  .highlight {
    font-size: 1.35rem;
    font-weight: 600;
    color: #ffd3b6;
    margin: 30px 0;
    display: block;
    letter-spacing: 0.12em;
  }

  .sub-note {
    font-size: 0.92rem;
    color: #cbd5e1;
    line-height: 1.9;
    margin-top: 15px;
  }

  .signature {
    font-size: 0.9rem;
    color: #94a3b8;
    margin-top: 35px;
    letter-spacing: 0.1em;
  }

  .btn {
    background: transparent;
    color: #ffd3b6;
    border: 1px solid rgba(255, 211, 182, 0.6);
    padding: 11px 30px;
    font-size: 0.95rem;
    font-family: 'Shippori Mincho', serif;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.1em;
    margin-top: 10px;
  }

  .btn:hover, .btn:active {
    background: rgba(255, 211, 182, 0.15);
    border-color: #ffd3b6;
  }

  /* 背景の星空 */
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--duration) infinite ease-in-out;
    z-index: 1;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--max-opacity); transform: scale(1.2); }
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="container">
  <!-- ステップ1 -->
  <div class="step active" id="step1">
    <p>奏へ</p>
    <p>今日は11月22日。<br>いいふうふの日だね。</p>
    <p>本当は今すぐそっちに行って<br>直接顔を見て伝えたかったことがあるんだ。</p>
    <button class="btn" onclick="nextStep(2)">ページをめくる</button>
  </div>

  <!-- ステップ2 -->
  <div class="step" id="step2">
    <p>離れていても、<br>奏と過ごした日々の<br>優しい記憶が<br>いつもわたしを支えてくれているよ。</p>
    <p>本当にありがとう。</p>
    <button class="btn" onclick="nextStep(3)">次へ</button>
  </div>

  <!-- ステップ3：プロポーズして静かに終わる -->
  <div class="step" id="step3">
    <p>これから先も、<br>どんな季節も、どんな未来も、<br>一番近くで奏と歩んでいきたい。</p>
    <span class="highlight">わたしと結婚してください。</span>
    <p class="sub-note">
      今はただ、この気持ちを伝えたかっただけだから<br>
      返事は急がないよ。<br>
      これからもずっと大好きです。
    </p>
    <p class="signature">2026.11.22 えりかより</p>
  </div>
</div>

<script>
  function nextStep(stepNumber) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + stepNumber).classList.add('active');
  }

  function initStars() {
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 45; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
      star.style.setProperty('--max-opacity', Math.random() * 0.7 + 0.3);
      starsContainer.appendChild(star);
    }
  }

  initStars();
</script>

</body>
</html>
